name: Publish TestRail MCP release
on:
  workflow_dispatch:
permissions: {}
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' && github.actor == 'mikhailhimei'
    timeout-minutes: 5
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test MCP protocols and all CLI routes
        run: node --test tests/*.test.mjs
      - name: Build and verify the unified installer
        run: |
          python3 installers/package.py release-dist --setup-only
          unzip -tq release-dist/testrail-chat-setup.zip
          unzip -p release-dist/testrail-chat-setup.zip testrail-chat/setup.mjs > /dev/null
      - name: Publish the unified installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=v1.5.10
          title='v1.5.10 — TestRail MCP для Qwen и DeepSeek'
          notes="release-artifacts/$version/notes.md"
          if ! draft=$(gh release view "$version" --json isDraft --jq '.isDraft' 2>/dev/null); then
            gh release create "$version" --draft --target "${{ github.sha }}" --title "$title" --notes-file "$notes"
            draft=true
          fi
          if [ "$draft" = true ]; then
            gh release upload "$version" release-dist/testrail-chat-setup.zip --clobber
          else
            gh release download "$version" --pattern testrail-chat-setup.zip --dir release-dist --clobber
          fi
          (cd release-dist && sha256sum testrail-chat-setup.zip > SHA256SUMS.txt)
          gh release upload "$version" release-dist/SHA256SUMS.txt --clobber
          gh release view "$version" --json assets --jq '.assets[].name' > release-dist/assets.txt
          for asset in testrail-chat-plugin-codex.zip testrail-chat-plugin-gemini.zip testrail-chat-plugin-copilot.zip testrail-chrome-extension.zip; do
            if grep -Fxq "$asset" release-dist/assets.txt; then
              gh release delete-asset "$version" "$asset" --yes
            fi
          done
          gh release edit "$version" --draft=false --latest --title "$title" --notes-file "$notes"
